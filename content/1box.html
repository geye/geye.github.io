<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
    /* === 核心样式 === */
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; }
    
    .search-wrapper {
        position: relative;
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        z-index: 1000; 
    }

    /* 主搜索栏容器 - 胶囊形状 */
    .search-bar {
        display: flex;
        align-items: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 50px;
        padding: 6px 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        transition: all 0.3s ease;
    }

    .search-bar:focus-within {
        box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
        border-color: #3b82f6;
    }

    /* 搜索引擎选择器 */
    .engine-select {
        border: none;
        background: transparent;
        font-weight: 600;
        color: #333;
        cursor: pointer;
        outline: none;
        padding-right: 10px;
        border-right: 1px solid #eee;
        margin-right: 10px;
        font-size: 14px;
    }

    /* 输入框 */
    .search-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: #333;
        background: transparent;
    }

    /* 清空按钮 */
    .clear-btn {
        cursor: pointer;
        color: #9ca3af;
        padding: 5px;
        display: flex;
        align-items: center;
        transition: color 0.2s;
    }
    .clear-btn:hover { color: #ef4444; }

    /* 搜索按钮 */
    .submit-btn {
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 30px;
        padding: 8px 20px;
        margin-left: 10px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: background 0.2s;
    }
    .submit-btn:hover { background: #2563eb; }

    /* === 悬浮下拉框样式 (关键修改) === */
    #global-suggestions {
        position: fixed; /* 改为 fixed 定位，脱离文档流 */
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        z-index: 99999; /* 极高优先级 */
        display: none; /* 默认隐藏 */
        overflow: hidden;
        border: 1px solid rgba(0,0,0,0.05);
        max-height: 300px;
        overflow-y: auto;
    }

    .suggestion-item {
        padding: 12px 20px;
        cursor: pointer;
        font-size: 14px;
        color: #4b5563;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.2s;
    }
    .suggestion-item:hover, .suggestion-item.active {
        background: #eff6ff;
        color: #2563eb;
    }
    .suggestion-icon { font-size: 12px; opacity: 0.5; }
</style>
</head>
<body>

<!-- 搜索组件结构 -->
<div class="search-wrapper" id="searchWrapper">
    <div class="search-bar">
        <select class="engine-select" id="engineSelect">
            <option value="bing">Bing</option>
            <option value="baidu">百度</option>
            <option value="google">Google</option>
        </select>
        
        <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索..." autocomplete="off">
        
        <!-- 清空历史记录图标 -->
        <div class="clear-btn" id="clearBtn" title="清空历史">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </div>

        <button class="submit-btn" onclick="performSearch()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            搜索
        </button>
    </div>
</div>

<!-- 全局下拉框容器 (放在 body 最后，确保不被遮挡) -->
<div id="global-suggestions"></div>

<script>
    const input = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('global-suggestions');
    const wrapper = document.getElementById('searchWrapper');
    const clearBtn = document.getElementById('clearBtn');
    
    // 历史记录存储
    let history = JSON.parse(localStorage.getItem('mySearchHistory')) || [];

    // 监听输入
    input.addEventListener('input', function(e) {
        const val = e.target.value.trim();
        if (!val) {
            hideSuggestions();
            return;
        }
        
        // 获取建议并显示
        fetchSuggestions(val).then(list => {
            renderSuggestions(list);
            positionDropdown(); // 每次渲染都重新计算位置
        });
    });

    // 聚焦时也显示（如果有内容）
    input.addEventListener('focus', function() {
        if(input.value.trim()) {
            fetchSuggestions(input.value.trim()).then(renderSuggestions);
            positionDropdown();
        }
    });

    // 点击外部关闭
    document.addEventListener('click', function(e) {
        if (!wrapper.contains(e.target) && !suggestionsBox.contains(e.target)) {
            hideSuggestions();
        }
    });

    // 窗口滚动或缩放时重新定位
    window.addEventListener('scroll', hideSuggestions);
    window.addEventListener('resize', () => { if(suggestionsBox.style.display === 'block') positionDropdown(); });

    // 核心功能：获取热词 (使用公开接口绕过跨域)
    async function fetchSuggestions(query) {
        try {
            // 尝试获取百度联想词 (JSONP方式)
            return await new Promise((resolve) => {
                const script = document.createElement('script');
                // 百度接口：wd=关键词, cb=回调函数名
                script.src = `https://sp0.baidu.com/5a1Fazu8AA54nxGko9WTAnF6hhy/su?wd=${encodeURIComponent(query)}&cb=handleBaiduSuggestion`;
                
                // 临时挂载全局回调
                window.handleBaiduSuggestion = (data) => {
                    const list = data.s || [];
                    // 合并本地历史记录
                    const localHits = history.filter(h => h.includes(query) && !list.includes(h));
                    resolve([...list, ...localHits].slice(0, 8)); // 最多显示8条
                    cleanup();
                };

                const cleanup = () => {
                    document.body.removeChild(script);
                    delete window.handleBaiduSuggestion;
                    // 超时处理
                    setTimeout(() => { if(typeof window.handleBaiduSuggestion === 'function') resolve(history.filter(h=>h.includes(query)).slice(0,5)); }, 2000);
                };

                document.body.appendChild(script);
            });
        } catch (e) {
            return history.filter(h => h.includes(query)).slice(0, 5);
        }
    }

    // 渲染下拉列表
    function renderSuggestions(list) {
        if (list.length === 0) {
            hideSuggestions();
            return;
        }
        
        suggestionsBox.innerHTML = list.map(item => `
            <div class="suggestion-item" onclick="selectSuggestion('${item}')">
                <span class="suggestion-icon">🔍</span> ${item}
            </div>
        `).join('');
        
        suggestionsBox.style.display = 'block';
        positionDropdown(); // 确保位置正确
    }

    // 动态计算位置 (解决被遮挡的核心逻辑)
    function positionDropdown() {
        const rect = wrapper.getBoundingClientRect();
        // 设置宽度与搜索框一致
        suggestionsBox.style.width = rect.width + 'px';
        // 设置在搜索框正下方，留一点间隙
        suggestionsBox.style.top = (rect.bottom + window.scrollY + 8) + 'px';
        suggestionsBox.style.left = rect.left + 'px';
    }

    function hideSuggestions() {
        suggestionsBox.style.display = 'none';
    }

    // 选中词条
    window.selectSuggestion = function(text) {
        input.value = text;
        saveHistory(text);
        performSearch();
        hideSuggestions();
    }

    // 执行搜索
    window.performSearch = function() {
        const query = input.value.trim();
        if (!query) return;
        
        saveHistory(query);
        const engine = document.getElementById('engineSelect').value;
        let url = '';
        
        switch(engine) {
            case 'baidu': url = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`; break;
            case 'google': url = `https://www.google.com/search?q=${encodeURIComponent(query)}`; break;
            default: url = `https://cn.bing.com/search?q=${encodeURIComponent(query)}`;
        }
        window.open(url, '_blank');
    }

    // 保存历史
    function saveHistory(text) {
        history = [text, ...history.filter(h => h !== text)].slice(0, 20);
        localStorage.setItem('mySearchHistory', JSON.stringify(history));
    }

    // 清空历史
    clearBtn.addEventListener('click', () => {
        if(confirm('确定要清空所有搜索记录吗？')) {
            localStorage.removeItem('mySearchHistory');
            history = [];
            input.focus();
        }
    });

    // 回车搜索
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });

</script>
</body>
</html>
