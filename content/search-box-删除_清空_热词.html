<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<style>
    /* 1. 定义默认（亮色）变量 */
    :root {
        --bg-color: #f9fafb;       /* 页面背景 */
        --text-color: #333333;     /* 文字颜色 */
        --border-color: #e2e8f0;   /* 边框颜色 */
        --input-bg: #ffffff;       /* 输入框/容器背景 */
        --placeholder-color: #9ca3af; /* 占位符颜色 */
        --shadow-color: rgba(0,0,0,0.05); /* 阴影颜色 */
        --shadow-focus-color: rgba(59, 130, 246, 0.15); /* 聚焦时阴影颜色 */
        --suggestion-bg: rgba(255, 255, 255, 0.95); /* 下拉框背景 */
        --suggestion-hover-bg: #eff6ff; /* 下拉框悬停背景 */
        --suggestion-text: #4b5563; /* 下拉框文字 */
        --suggestion-active-text: #2563eb; /* 下拉框激活文字 */
        --icon-color: #9ca3af;   /* 图标颜色 */
        --icon-hover-color: #ef4444; /* 图标悬停颜色 */
        --delete-bg-hover: #fee2e2; /* 删除按钮悬停背景 */
		--sb-bg-color: #ffffff;      /* 默认白底 */
		--sb-text-color: #333333;
    }

    /* 2. 定义暗色模式变量 (当 body 有 .dark 类时生效) */
    body.dark, .dark-mode-force  {
        --bg-color: #1a1a1a;
        --text-color: #e0e0e0;
        --border-color: #444444;
        --input-bg: #2c2c2c;
        --placeholder-color: #777;
        --shadow-color: rgba(0,0,0,0.3);
        --shadow-focus-color: rgba(59, 130, 246, 0.3);
        --suggestion-bg: rgba(42, 42, 42, 0.95);
        --suggestion-hover-bg: #374151;
        --suggestion-text: #d1d5db;
        --suggestion-active-text: #60a5fa;
        --icon-color: #777;
        --icon-hover-color: #f87171;
        --delete-bg-hover: #7f1d1d;
		--sb-bg-color: #181818 !important; /* 这里改成你想要的深色，比如黑色或深灰 */
		--sb-text-color: #e0e0e0;
    }

    /* === 核心样式 === */
    body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--sb-bg-color);
        color: var(--sb-text-color);
        transition: background-color 0.3s, color 0.3s;
    }

    .search-wrapper {
        position: relative;
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        z-index: 1000;
    }

    /* 主搜索栏容器 - 胶囊形状 */
    .search-bar {
        display: flex;
        align-items: center;
        background: var(--input-bg); /* 修改：使用变量 */
        border: 1px solid var(--border-color); /* 修改：使用变量 */
        border-radius: 50px;
        padding: 6px 15px;
        box-shadow: 0 4px 15px var(--shadow-color); /* 修改：使用变量 */
        transition: all 0.3s ease;
    }

    .search-bar:focus-within {
        box-shadow: 0 8px 25px var(--shadow-focus-color); /* 修改：使用变量 */
        border-color: #3b82f6;
    }

    /* 搜索引擎选择器 */
    .engine-select {
        border: none;
        background: transparent;
        font-weight: 600;
        color: var(--text-color); /* 修改：使用变量 */
        cursor: pointer;
        outline: none;
        padding-right: 10px;
        border-right: 1px solid var(--border-color); /* 修改：使用变量 */
        margin-right: 10px;
        font-size: 14px;
    }

    /* 输入框 */
    .search-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: var(--text-color); /* 修改：使用变量 */
        background: transparent;
    }
    
    .search-input::placeholder {
        color: var(--placeholder-color); /* 新增：占位符颜色 */
    }

    /* 清空输入框按钮 */
    .clear-input-btn {
        cursor: pointer;
        color: var(--icon-color); /* 修改：使用变量 */
        padding: 5px;
        display: none;
        align-items: center;
        transition: color 0.2s;
    }

    .clear-input-btn:hover {
        color: var(--icon-hover-color); /* 修改：使用变量 */
    }

    /* 清空历史记录图标 */
    .clear-history-btn {
        cursor: pointer;
        color: var(--icon-color); /* 修改：使用变量 */
        padding: 5px;
        display: flex;
        align-items: center;
        transition: color 0.2s;
    }

    .clear-history-btn:hover {
        color: var(--icon-hover-color); /* 修改：使用变量 */
    }

    /* 搜索按钮 */
    .submit-btn {
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 30px;
        padding: 8px 20px;
        margin-left: 10px;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: background 0.2s;
    }

    .submit-btn:hover {
        background: #2563eb;
    }

    /* === 悬浮下拉框样式 === */
    #global-suggestions {
        position: fixed;
        background: var(--suggestion-bg); /* 修改：使用变量 */
        backdrop-filter: blur(10px);
        border-radius: 12px;
        box-shadow: 0 10px 40px var(--shadow-color); /* 修改：使用变量 */
        z-index: 99999;
        display: none;
        overflow: hidden;
        border: 1px solid var(--border-color); /* 修改：使用变量 */
        max-height: 300px;
        overflow-y: auto;
    }

    .suggestion-item {
        padding: 12px 20px;
        cursor: pointer;
        font-size: 14px;
        color: var(--suggestion-text); /* 修改：使用变量 */
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: background 0.2s, color 0.2s; /* 新增：颜色过渡 */
    }

    .suggestion-item:hover, .suggestion-item.active {
        background: var(--suggestion-hover-bg); /* 修改：使用变量 */
        color: var(--suggestion-active-text); /* 修改：使用变量 */
    }

    .suggestion-content {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
    }

    .suggestion-icon {
        font-size: 12px;
        opacity: 0.5;
    }

    /* 单条删除按钮样式 */
    .delete-item-btn {
        cursor: pointer;
        color: var(--icon-color); /* 修改：使用变量 */
        padding: 4px;
        border-radius: 4px;
        opacity: 0;
        transition: all 0.2s;
    }

    .delete-item-btn:hover {
        color: var(--icon-hover-color); /* 修改：使用变量 */
        background-color: var(--delete-bg-hover); /* 修改：使用变量 */
    }

    .suggestion-item:hover .delete-item-btn {
        opacity: 1;
    }
	
	
</style>
        
		
</head>
<body>
    <!-- 搜索组件结构 -->
    <div class="search-wrapper" id="searchWrapper">
        <div class="search-bar">
            <select class="engine-select" id="engineSelect">
                <option value="bing">Bing</option>
                <option value="baidu">Baidu</option>
                <option value="google">Google</option>
            </select>
            <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索..." autocomplete="off">
            <!-- 清空输入框按钮 (新增) -->
            <div class="clear-input-btn" id="clearInputBtn" title="清空输入">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <!-- 清空历史记录按钮 -->
            <div class="clear-history-btn" id="clearHistoryBtn" title="清空全部历史">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </div>
            <button class="submit-btn" onclick="performSearch()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> 搜索
            </button>
        </div>
    </div>
    <!-- 全局下拉框容器 -->
    <div id="global-suggestions"></div>

    <script>
        const input = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('global-suggestions');
        const wrapper = document.getElementById('searchWrapper');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const clearInputBtn = document.getElementById('clearInputBtn'); // 新增：获取清空输入按钮元素

        // 历史记录存储
        let history = JSON.parse(localStorage.getItem('mySearchHistory')) || [];

        // 监听输入
        input.addEventListener('input', function(e) {
            const val = e.target.value.trim();
            // 控制清空输入按钮的显示与隐藏
            clearInputBtn.style.display = val ? 'flex' : 'none';
            
            if (!val) {
                hideSuggestions();
                return;
            }
            // 获取建议并显示
            fetchSuggestions(val).then(list => {
                renderSuggestions(list);
                positionDropdown();
            });
        });

        // 聚焦时也显示（如果有内容）
        input.addEventListener('focus', function() {
            if(input.value.trim()) {
                fetchSuggestions(input.value.trim()).then(renderSuggestions);
                positionDropdown();
            }
        });

        // 点击外部关闭
        document.addEventListener('click', function(e) {
            if (!wrapper.contains(e.target) && !suggestionsBox.contains(e.target)) {
                hideSuggestions();
            }
        });

        // 窗口滚动或缩放时重新定位
        window.addEventListener('scroll', hideSuggestions);
        window.addEventListener('resize', () => {
            if(suggestionsBox.style.display === 'block') positionDropdown();
        });

        // 核心功能：获取热词
        async function fetchSuggestions(query) {
            try {
                return await new Promise((resolve) => {
                    const script = document.createElement('script');
                    script.src = `https://sp0.baidu.com/5a1Fazu8AA54nxGko9WTAnF6hhy/su?wd=${encodeURIComponent(query)}&cb=handleBaiduSuggestion`;
                    window.handleBaiduSuggestion = (data) => {
                        const list = data.s || [];
                        const localHits = history.filter(h => h.includes(query) && !list.includes(h));
                        resolve([...list, ...localHits].slice(0, 8));
                        cleanup();
                    };
                    const cleanup = () => {
                        document.body.removeChild(script);
                        delete window.handleBaiduSuggestion;
                        setTimeout(() => {
                            if(typeof window.handleBaiduSuggestion === 'function') resolve(history.filter(h=>h.includes(query)).slice(0,5));
                        }, 2000);
                    };
                    document.body.appendChild(script);
                });
            } catch (e) {
                return history.filter(h => h.includes(query)).slice(0, 5);
            }
        }

        // 渲染下拉列表 (修改：增加删除按钮)
        function renderSuggestions(list) {
            if (list.length === 0) {
                hideSuggestions();
                return;
            }
            suggestionsBox.innerHTML = list.map(item => `
                <div class="suggestion-item" onclick="selectSuggestion('${item}')">
                    <div class="suggestion-content">
                        <span class="suggestion-icon">🔍</span>
                        ${item}
                    </div>
                    <div class="delete-item-btn" onclick="deleteHistoryItem('${item}')" title="删除此条记录">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </div>
                </div>
            `).join('');
            suggestionsBox.style.display = 'block';
            positionDropdown();
        }

        // 动态计算位置
        function positionDropdown() {
            const rect = wrapper.getBoundingClientRect();
            suggestionsBox.style.width = rect.width + 'px';
            suggestionsBox.style.top = (rect.bottom + window.scrollY + 8) + 'px';
            suggestionsBox.style.left = rect.left + 'px';
        }

        function hideSuggestions() {
            suggestionsBox.style.display = 'none';
        }

        // 选中词条
        window.selectSuggestion = function(text) {
            input.value = text;
            saveHistory(text);
            performSearch();
            hideSuggestions();
        }

        // 执行搜索
        window.performSearch = function() {
            const query = input.value.trim();
            if (!query) return;
            saveHistory(query);
            const engine = document.getElementById('engineSelect').value;
            let url = '';
            switch(engine) {
                case 'baidu': url = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`; break;
                case 'google': url = `https://www.google.com/search?q=${encodeURIComponent(query)}`; break;
                default: url = `https://cn.bing.com/search?q=${encodeURIComponent(query)}`;
            }
            window.open(url, '_blank');
        }

        // 保存历史
        function saveHistory(text) {
            history = [text, ...history.filter(h => h !== text)].slice(0, 20);
            localStorage.setItem('mySearchHistory', JSON.stringify(history));
        }

        // 删除单条历史 (新增功能)
        window.deleteHistoryItem = function(text) {
            // 阻止事件冒泡，防止触发选中词条
            event.stopPropagation();
            history = history.filter(h => h !== text);
            localStorage.setItem('mySearchHistory', JSON.stringify(history));
            // 重新渲染列表，不关闭弹窗
            if(input.value.trim()) {
                fetchSuggestions(input.value.trim()).then(renderSuggestions);
            }
        }

        // 清空全部历史 (修改：移除弹窗提示)
        clearHistoryBtn.addEventListener('click', () => {
            localStorage.removeItem('mySearchHistory');
            history = [];
            input.focus();
            hideSuggestions(); // 清空后隐藏列表
        });

        // 清空输入框内容 (新增功能)
        clearInputBtn.addEventListener('click', () => {
            input.value = '';
            clearInputBtn.style.display = 'none'; // 隐藏按钮
            input.focus();
            hideSuggestions();
        });

        // 回车搜索
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>

<!-- === 新增：主题同步逻辑开始 === -->
<script>
    // 1. 定义切换主题的函数
    function applyTheme(isDark) {
        if (isDark) {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
    }

    // 2. 初始化：页面刚加载时，尝试获取父页面状态
    // 注意：如果是本地直接打开 html 文件测试可能会跨域报错，但在 Quartz 服务器上通常没问题
    try {
        const parentIsDark = window.parent.document.documentElement.classList.contains('dark');
        applyTheme(parentIsDark);
    } catch (e) {
        console.log("Iframe: 等待父页面消息通知...");
    }

    // 3. 监听来自 Quartz 主页面的消息
    window.addEventListener('message', function(event) {
        // 确保消息格式正确
        if (event.data && event.data.type === 'theme-change') {
            applyTheme(event.data.isDark);
        }
    });
</script>
<!-- === 新增：主题同步逻辑结束 === -->

</body>
</html>
